<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="max-width:100%;height:auto;background:#0f1117">
  <defs>
    <style>

      /* 标题逐字落下 */
      .tchar { opacity:0; transform-box: fill-box; transform-origin: center;
               animation: tcharIn .62s cubic-bezier(.22,1,.36,1) both; }
      @keyframes tcharIn { from { opacity:0; transform: translateY(-34px) scale(1.12); }
                           to { opacity:1; transform: translateY(0) scale(1); } }

      .tagline { opacity:0; animation: taglineIn .6s cubic-bezier(.22,1,.36,1) both; }
      @keyframes taglineIn { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }

      .colHead { opacity:0; animation: colHeadIn .56s cubic-bezier(.22,1,.36,1) both; }
      @keyframes colHeadIn { from { opacity:0; transform: translateY(-12px); } to { opacity:1; transform: translateY(0); } }

      .rowHead { opacity:0; animation: rowHeadIn .6s cubic-bezier(.22,1,.36,1) both; }
      @keyframes rowHeadIn { from { opacity:0; transform: translateX(-18px); } to { opacity:1; transform: translateX(0); } }

      /* 四个象限从各自角落飞入 */
      .cellTL { opacity:0; animation: cellTLIn .64s cubic-bezier(.22,1,.36,1) both; }
      @keyframes cellTLIn { from { opacity:0; transform: translate(-26px,-20px); } to { opacity:1; transform: translate(0,0); } }

      .cellTR { opacity:0; animation: cellTRIn .64s cubic-bezier(.22,1,.36,1) both; }
      @keyframes cellTRIn { from { opacity:0; transform: translate(26px,-20px); } to { opacity:1; transform: translate(0,0); } }

      .cellBL { opacity:0; animation: cellBLIn .64s cubic-bezier(.22,1,.36,1) both; }
      @keyframes cellBLIn { from { opacity:0; transform: translate(-26px,20px); } to { opacity:1; transform: translate(0,0); } }

      .cellBR { opacity:0; animation: cellBRIn .64s cubic-bezier(.22,1,.36,1) both; }
      @keyframes cellBRIn { from { opacity:0; transform: translate(26px,20px); } to { opacity:1; transform: translate(0,0); } }

      /* 主角呼吸；延迟前保持透明 */
      .heroRing { opacity:0; transform-box: fill-box; transform-origin: center;
                  animation: heroGlow 3.4s ease-in-out 2.85s infinite; }
      @keyframes heroGlow { 0%,100% { opacity:.42; transform: scale(1); }
                            50% { opacity:.95; transform: scale(1.012); } }

      /* 主角文字一次强调 */
      .heroLabel { transform-box: fill-box; transform-origin: center;
                   animation: heroPulse .9s cubic-bezier(.34,1.3,.64,1) 3.05s both; }
      @keyframes heroPulse { 0% { transform: scale(1); } 45% { transform: scale(1.07); } 100% { transform: scale(1); } }
    </style>
  </defs>

  <svg x="0" y="0" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
  <defs>
      <!-- 底色：极深冷灰，上略暗下略亮 -->
      <linearGradient id="bg-base" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#0d0d10"/>
        <stop offset="0.42" stop-color="#131317"/>
        <stop offset="0.78" stop-color="#15151a"/>
        <stop offset="1"    stop-color="#111114"/>
      </linearGradient>
  
      <!-- 大面积柔光：只为打破死黑、做出体积，强度很低 -->
      <radialGradient id="bg-washA" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"    stop-color="#a8aec6" stop-opacity="0.04"/>
        <stop offset="0.55" stop-color="#a8aec6" stop-opacity="0.018"/>
        <stop offset="1"    stop-color="#a8aec6" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="bg-washB" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"    stop-color="#8b91a8" stop-opacity="0.032"/>
        <stop offset="0.6"  stop-color="#8b91a8" stop-opacity="0.014"/>
        <stop offset="1"    stop-color="#8b91a8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="bg-washC" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"    stop-color="#c9ccd8" stop-opacity="0.028"/>
        <stop offset="1"    stop-color="#c9ccd8" stop-opacity="0"/>
      </radialGradient>
  
      <!-- 暗角：四角压暗，但不压死 -->
      <radialGradient id="bg-vignette" cx="0.46" cy="0.44" r="0.78">
        <stop offset="0"    stop-color="#000000" stop-opacity="0"/>
        <stop offset="0.62" stop-color="#000000" stop-opacity="0.10"/>
        <stop offset="0.86" stop-color="#000000" stop-opacity="0.32"/>
        <stop offset="1"    stop-color="#000000" stop-opacity="0.55"/>
      </radialGradient>
  
      <!-- 右侧收暗，让重心偏左，方便放标题 -->
      <linearGradient id="bg-rightFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
        <stop offset="1"    stop-color="#000000" stop-opacity="0.26"/>
      </linearGradient>
  
      <!-- 每 5 格的辅助线，稍亮一点，给画面结构感 -->
      <pattern id="bg-gridMajor" width="270" height="270" patternUnits="userSpaceOnUse">
        <path d="M270 0 H0 V270" fill="none" stroke="#dfe4f2" stroke-opacity="0.075" stroke-width="1.5"/>
      </pattern>
  
      <!-- 竖向极淡光带：模拟压缩后那种一条条的光柱 -->
      <filter id="bg-softBeam" x="-30%" y="-10%" width="160%" height="120%">
        <feGaussianBlur stdDeviation="42"/>
      </filter>
      <linearGradient id="bg-beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.032"/>
        <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
  
      <!-- 颗粒：抵消视频压缩后的色带 -->
      <filter id="bg-grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
        <feComponentTransfer in="mono">
          <feFuncA type="linear" slope="0.05"/>
        </feComponentTransfer>
      </filter>
  
    </defs>
  <rect width="1920" height="1080" fill="url(#bg-base)"/>
  
    
    <ellipse cx="620" cy="470" rx="1000" ry="700" fill="url(#bg-washA)"/>
    <ellipse cx="1180" cy="760" rx="820" ry="520" fill="url(#bg-washB)"/>
    <ellipse cx="300" cy="900" rx="700" ry="420" fill="url(#bg-washC)"/>
  
    
    <g opacity="0.9">
      <rect x="150"  y="-60" width="260" height="1200" fill="url(#bg-beamGrad)" filter="url(#bg-softBeam)"/>
      <rect x="640"  y="-60" width="150" height="1200" fill="url(#bg-beamGrad)" filter="url(#bg-softBeam)"/>
      <rect x="1010" y="-60" width="380" height="1200" fill="url(#bg-beamGrad)" filter="url(#bg-softBeam)"/>
      <rect x="1560" y="-60" width="220" height="1200" fill="url(#bg-beamGrad)" filter="url(#bg-softBeam)"/>
    </g>
  
    
    <g id="bg-grid" fill="none" stroke="#d3d9ec" stroke-linecap="butt">
      <g stroke-opacity="0.10" stroke-width="1.5">
        <line x1="53.33" y1="0" x2="53.33" y2="1080"/>
        <line x1="106.67" y1="0" x2="106.67" y2="1080"/>
        <line x1="160.0" y1="0" x2="160.0" y2="1080"/>
        <line x1="213.33" y1="0" x2="213.33" y2="1080"/>
        <line x1="266.67" y1="0" x2="266.67" y2="1080"/>
        <line x1="320.0" y1="0" x2="320.0" y2="1080"/>
        <line x1="373.33" y1="0" x2="373.33" y2="1080"/>
        <line x1="426.67" y1="0" x2="426.67" y2="1080"/>
        <line x1="480.0" y1="0" x2="480.0" y2="1080"/>
        <line x1="533.33" y1="0" x2="533.33" y2="1080"/>
        <line x1="586.67" y1="0" x2="586.67" y2="1080"/>
        <line x1="640.0" y1="0" x2="640.0" y2="1080"/>
        <line x1="693.33" y1="0" x2="693.33" y2="1080"/>
        <line x1="746.67" y1="0" x2="746.67" y2="1080"/>
        <line x1="800.0" y1="0" x2="800.0" y2="1080"/>
        <line x1="853.33" y1="0" x2="853.33" y2="1080"/>
        <line x1="906.67" y1="0" x2="906.67" y2="1080"/>
        <line x1="960.0" y1="0" x2="960.0" y2="1080"/>
        <line x1="1013.33" y1="0" x2="1013.33" y2="1080"/>
        <line x1="1066.67" y1="0" x2="1066.67" y2="1080"/>
        <line x1="1120.0" y1="0" x2="1120.0" y2="1080"/>
        <line x1="1173.33" y1="0" x2="1173.33" y2="1080"/>
        <line x1="1226.67" y1="0" x2="1226.67" y2="1080"/>
        <line x1="1280.0" y1="0" x2="1280.0" y2="1080"/>
        <line x1="1333.33" y1="0" x2="1333.33" y2="1080"/>
        <line x1="1386.67" y1="0" x2="1386.67" y2="1080"/>
        <line x1="1440.0" y1="0" x2="1440.0" y2="1080"/>
        <line x1="1493.33" y1="0" x2="1493.33" y2="1080"/>
        <line x1="0" y1="54" x2="1920" y2="54"/>
        <line x1="0" y1="108" x2="1920" y2="108"/>
        <line x1="0" y1="162" x2="1920" y2="162"/>
        <line x1="0" y1="216" x2="1920" y2="216"/>
        <line x1="0" y1="324" x2="1920" y2="324"/>
        <line x1="0" y1="378" x2="1920" y2="378"/>
        <line x1="0" y1="432" x2="1920" y2="432"/>
        <line x1="0" y1="486" x2="1920" y2="486"/>
        <line x1="0" y1="594" x2="1920" y2="594"/>
        <line x1="0" y1="648" x2="1920" y2="648"/>
        <line x1="0" y1="702" x2="1920" y2="702"/>
        <line x1="0" y1="756" x2="1920" y2="756"/>
        <line x1="0" y1="864" x2="1920" y2="864"/>
        <line x1="0" y1="918" x2="1920" y2="918"/>
        <line x1="0" y1="972" x2="1920" y2="972"/>
        <line x1="0" y1="1026" x2="1920" y2="1026"/>
      </g>
      <g stroke-opacity="0.15" stroke-width="1.5">
        <line x1="1546.67" y1="0" x2="1546.67" y2="1080"/>
        <line x1="1600.0" y1="0" x2="1600.0" y2="1080"/>
        <line x1="1653.33" y1="0" x2="1653.33" y2="1080"/>
        <line x1="1706.67" y1="0" x2="1706.67" y2="1080"/>
        <line x1="1760.0" y1="0" x2="1760.0" y2="1080"/>
        <line x1="1813.33" y1="0" x2="1813.33" y2="1080"/>
        <line x1="1866.67" y1="0" x2="1866.67" y2="1080"/>
        
        <line x1="0" y1="0" x2="1920" y2="0"/>
        <line x1="0" y1="270" x2="1920" y2="270"/>
        <line x1="0" y1="540" x2="1920" y2="540"/>
        <line x1="0" y1="810" x2="1920" y2="810"/>
        <line x1="0" y1="1080" x2="1920" y2="1080"/>
      </g>
    </g>
  
    
    <rect width="1920" height="1080" fill="url(#bg-rightFade)"/>
    <rect width="1920" height="1080" fill="url(#bg-vignette)"/>
  
    
    <rect width="1920" height="1080" filter="url(#bg-grain)" style="mix-blend-mode:overlay" opacity="0.9"/>
    </svg>

  <!-- ===== 顶部章节目录：占位（后期统一渲染） ===== -->
  <g id="kc-toc">
    <rect x="96" y="48" width="1728" height="10" rx="5" fill="#1f2733"/>
    <circle cx="96" cy="53" r="9" fill="#475569"/>
    <circle cx="960" cy="53" r="9" fill="#475569"/>
    <circle cx="1824" cy="53" r="9" fill="#475569"/>
  </g>

  <!-- ===== 标题：逐字 ===== -->
  <g id="kc-title">
    <text x="768"  y="214" text-anchor="middle" class="tchar" style="animation-delay:.35s" font-size="92" fill="#e8edf6" font-family="仓耳渔阳体 W05">知</text>
    <text x="864"  y="214" text-anchor="middle" class="tchar" style="animation-delay:.43s" font-size="92" fill="#e8edf6" font-family="仓耳渔阳体 W05">识</text>
    <text x="960"  y="214" text-anchor="middle" class="tchar" style="animation-delay:.51s" font-size="92" fill="#e8edf6" font-family="仓耳渔阳体 W05">的</text>
    <text x="1056" y="214" text-anchor="middle" class="tchar" style="animation-delay:.59s" font-size="92" fill="#e8edf6" font-family="仓耳渔阳体 W05">诅</text>
    <text x="1152" y="214" text-anchor="middle" class="tchar" style="animation-delay:.67s" font-size="92" fill="#e8edf6" font-family="仓耳渔阳体 W05">咒</text>
    <text x="960"  y="272" font-family="仓耳渔阳体 W03" text-anchor="middle" class="tagline" style="animation-delay:.95s" font-size="28" font-weight="400" fill="#94a3b8">你懂的，他未必懂。</text>
  </g>

  <!-- ===== 四象限（画面主体） ===== -->
  <g id="kc-matrix">
    <!-- 列标题 -->
    <text x="604"  y="330" font-family="仓耳渔阳体 W03" text-anchor="middle" class="colHead" style="animation-delay:1.25s" font-size="26" letter-spacing="2" fill="#94a3b8">他知道</text>
    <text x="1316" y="330" font-family="仓耳渔阳体 W03" text-anchor="middle" class="colHead" style="animation-delay:1.37s" font-size="26" letter-spacing="2" fill="#94a3b8">他不知道</text>

    <!-- 行标题 -->
    <text x="244" y="493" font-family="仓耳渔阳体 W03" text-anchor="end" class="rowHead" style="animation-delay:1.37s" font-size="26" letter-spacing="2" fill="#94a3b8">我知道</text>
    <text x="244" y="769" font-family="仓耳渔阳体 W03" text-anchor="end" class="rowHead" style="animation-delay:1.49s" font-size="26" letter-spacing="2" fill="#94a3b8">我不知道</text>

    <!-- 象限 1：共识区 -->
    <g class="cellTL" style="animation-delay:1.90s">
      <rect x="264" y="362" width="680" height="244" rx="20" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-width="2.5"/>
      <text x="604" y="501" text-anchor="middle" font-family="仓耳渔阳体 W04" font-size="48" fill="#e8edf6">共识区</text>
    </g>

    <!-- 象限 2：知识诅咒区（主角） -->
    <g class="cellTR" style="animation-delay:2.08s">
      <rect x="976" y="362" width="680" height="244" rx="20" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-width="3.5"/>
      <rect x="976" y="362" width="680" height="244" rx="20" fill="none" stroke="#ef4444" stroke-width="7" class="heroRing"/>
      <text x="1316" y="501" text-anchor="middle" font-family="仓耳渔阳体 W04" font-size="48" fill="#f87171" class="heroLabel">知识诅咒区</text>
    </g>

    <!-- 象限 3：请教区 -->
    <g class="cellBL" style="animation-delay:2.26s">
      <rect x="264" y="638" width="680" height="244" rx="20" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="604" y="777" text-anchor="middle" font-family="仓耳渔阳体 W04" font-size="48" fill="#e8edf6">请教区</text>
    </g>

    <!-- 象限 4：共同盲区 -->
    <g class="cellBR" style="animation-delay:2.44s">
      <rect x="976" y="638" width="680" height="244" rx="20" fill="#94a3b8" fill-opacity="0.08" stroke="#64748b" stroke-width="2.5"/>
      <text x="1316" y="777" text-anchor="middle" font-family="仓耳渔阳体 W04" font-size="48" fill="#cbd5e1">共同盲区</text>
    </g>
  </g>

  <!-- ===== 底部字幕：占位（后期统一渲染） ===== -->
  <g id="kc-sub">
    <rect x="676" y="940" width="568" height="84" rx="10" fill="#4a4a48" fill-opacity="0.30"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="960" y="1002" font-family="仓耳渔阳体 W03" text-anchor="middle" font-size="28" font-weight="400" fill="#94a3b8">字幕占位</text>
  </g>
</svg>
