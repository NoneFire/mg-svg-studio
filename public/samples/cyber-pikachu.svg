<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="赛博搬砖皮卡付 开场动画"
     style="--t:0s">
  <title>赛博搬砖皮卡付 · 开场动画</title>
  <desc>7 秒开场：网格点亮 → 横线画出 → 名字逐字落位 → 口号拉开字距。1920×1080，可循环播放的背景底。</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0d0d10"/>
      <stop offset="0.42" stop-color="#131317"/>
      <stop offset="0.78" stop-color="#15151a"/>
      <stop offset="1"    stop-color="#111114"/>
    </linearGradient>

    <radialGradient id="washA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#a8aec6" stop-opacity="0.04"/>
      <stop offset="0.55" stop-color="#a8aec6" stop-opacity="0.018"/>
      <stop offset="1"    stop-color="#a8aec6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#8b91a8" stop-opacity="0.032"/>
      <stop offset="0.6"  stop-color="#8b91a8" stop-opacity="0.014"/>
      <stop offset="1"    stop-color="#8b91a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#c9ccd8" stop-opacity="0.028"/>
      <stop offset="1"    stop-color="#c9ccd8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.46" cy="0.44" r="0.78">
      <stop offset="0"    stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="0.86" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <linearGradient id="rightFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.26"/>
    </linearGradient>

    <filter id="softBeam" x="-30%" y="-10%" width="160%" height="120%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.032"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#cfe4ff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#cfe4ff" stop-opacity="0.03"/>
      <stop offset="0.92" stop-color="#eaf4ff" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0.34"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#8fe3ff"/>
      <stop offset="0.55" stop-color="#d9f4ff"/>
      <stop offset="1"    stop-color="#d9f4ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="sweepBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <style>
    .cjk  { font-family: "PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif; }
    .mono { font-family: "SF Mono",Menlo,Consolas,"Roboto Mono",monospace; }

    #name text { font-size:116px; font-weight:600; fill:#f4f6fa; }

    /* —— 名字逐字落位（挤压 / 拉伸 + 慢入慢出 + 轻微旋转弧线） —— */
    .ch {
      opacity:0; transform-box:fill-box; transform-origin:50% 100%;
      animation-name: charIn; animation-duration:.80s; animation-fill-mode:both;
      animation-timing-function: cubic-bezier(.4,0,.2,1);
      animation-delay: calc(var(--d,0s) - var(--t,0s));
    }
    @keyframes charIn {
      0%   { opacity:0; transform: translateY(40px) rotate(-2.4deg) scale(1.05); }
      52%  { opacity:1; transform: translateY(-8px) rotate(.7deg)  scale(.985); }
      74%  {           transform: translateY(3px)  rotate(0)     scale(1.014); }
      100% { opacity:1; transform: translateY(0)    rotate(0)     scale(1); }
    }

    /* —— 横线：画出后过冲再收回（跟随动作 / 预备） —— */
    #rule {
      transform-box:fill-box; transform-origin:left center;
      animation: ruleIn .62s cubic-bezier(.16,1.15,.3,1) .62s both;
      animation-delay: calc(.62s - var(--t,0s));
    }
    @keyframes ruleIn { 0%{transform:scaleX(0)} 70%{transform:scaleX(1.07)} 100%{transform:scaleX(1)} }

    /* —— 起点小方块：弹出（夸张 / 回弹） —— */
    #dot {
      transform-box:fill-box; transform-origin:center;
      animation: dotPop .55s cubic-bezier(.2,1.4,.4,1) both;
      animation-delay: calc(.54s - var(--t,0s));
    }
    @keyframes dotPop { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.6);opacity:1} 100%{transform:scale(1)} }

    /* —— 口号：字距从松到紧（跟随动作，与名字收尾重叠） —— */
    #slogan {
      opacity:0; transform-box:fill-box; transform-origin:left bottom;
      animation: sloganIn 1.05s cubic-bezier(.22,1,.36,1) both;
      animation-delay: calc(2.00s - var(--t,0s));
    }
    @keyframes sloganIn {
      0%   { opacity:0; letter-spacing:.44em; transform: translateY(22px); }
      100% { opacity:1; letter-spacing:.055em; transform: translateY(0); }
    }

    /* —— 网格点亮 + 呼吸（次要动作） —— */
    #grid {
      opacity:0; animation: gridIn .9s ease-out both, gridBreathe 4.4s ease-in-out infinite;
      animation-delay: calc(.08s - var(--t,0s)), calc(4.6s - var(--t,0s));
    }
    @keyframes gridIn { from{opacity:0} to{opacity:1} }
    @keyframes gridBreathe { 0%,100%{opacity:1} 50%{opacity:.86} }

    /* —— 扫描光带 —— */
    #scan {
      animation: scanMove 1.05s cubic-bezier(.42,0,.28,1) both;
      animation-delay: calc(.10s - var(--t,0s));
    }
    @keyframes scanMove {
      0%   { transform: translateX(-560px); opacity:0; }
      12%  { opacity:1; }
      80%  { opacity:1; }
      100% { transform: translateX(2480px); opacity:0; }
    }

    /* —— 二次动作：一道很宽的光缓缓扫过 —— */
    #sweep {
      opacity:0; animation: sweepMove 1.8s ease-in-out both;
      animation-delay: calc(2.35s - var(--t,0s));
    }
    @keyframes sweepMove {
      0%   { transform: translateX(-980px); opacity:0; }
      35%  { opacity:.9; }
      100% { transform: translateX(1500px); opacity:0; }
    }

    /* —— 光带缓慢漂移，让定格之后画面仍在呼吸 —— */
    #beams { animation: beamDrift 16s ease-in-out infinite; animation-delay: calc(0s - var(--t,0s)); }
    @keyframes beamDrift { 0%,100% { transform: translateX(-16px); } 50% { transform: translateX(16px); } }

    /* —— 整组轻微沉降 —— */
    #title { animation: settle 1.3s ease-out both; animation-delay: calc(3.15s - var(--t,0s)); }
    @keyframes settle { 0%{transform:translateY(7px)} 100%{transform:translateY(0)} }
  </style>

  <g id="stage">
    <rect width="1920" height="1080" fill="url(#base)"/>
    <ellipse cx="620" cy="470" rx="1000" ry="700" fill="url(#washA)"/>
    <ellipse cx="1180" cy="760" rx="820" ry="520" fill="url(#washB)"/>
    <ellipse cx="300" cy="900" rx="700" ry="420" fill="url(#washC)"/>

    <g id="beams" opacity="0.9">
      <rect x="150"  y="-60" width="260" height="1200" fill="url(#beamGrad)" filter="url(#softBeam)"/>
      <rect x="640"  y="-60" width="150" height="1200" fill="url(#beamGrad)" filter="url(#softBeam)"/>
      <rect x="1010" y="-60" width="380" height="1200" fill="url(#beamGrad)" filter="url(#softBeam)"/>
      <rect x="1560" y="-60" width="220" height="1200" fill="url(#beamGrad)" filter="url(#softBeam)"/>
    </g>

  <g id="grid" fill="none" stroke="#d3d9ec" stroke-linecap="butt">
    <g stroke-opacity="0.10" stroke-width="1.5">
      <line x1="54" y1="0" x2="54" y2="1080"/>
      <line x1="108" y1="0" x2="108" y2="1080"/>
      <line x1="162" y1="0" x2="162" y2="1080"/>
      <line x1="216" y1="0" x2="216" y2="1080"/>
      <line x1="324" y1="0" x2="324" y2="1080"/>
      <line x1="378" y1="0" x2="378" y2="1080"/>
      <line x1="432" y1="0" x2="432" y2="1080"/>
      <line x1="486" y1="0" x2="486" y2="1080"/>
      <line x1="594" y1="0" x2="594" y2="1080"/>
      <line x1="648" y1="0" x2="648" y2="1080"/>
      <line x1="702" y1="0" x2="702" y2="1080"/>
      <line x1="756" y1="0" x2="756" y2="1080"/>
      <line x1="864" y1="0" x2="864" y2="1080"/>
      <line x1="918" y1="0" x2="918" y2="1080"/>
      <line x1="972" y1="0" x2="972" y2="1080"/>
      <line x1="1026" y1="0" x2="1026" y2="1080"/>
      <line x1="1134" y1="0" x2="1134" y2="1080"/>
      <line x1="1188" y1="0" x2="1188" y2="1080"/>
      <line x1="1242" y1="0" x2="1242" y2="1080"/>
      <line x1="1296" y1="0" x2="1296" y2="1080"/>
      <line x1="1404" y1="0" x2="1404" y2="1080"/>
      <line x1="1458" y1="0" x2="1458" y2="1080"/>
      <line x1="1512" y1="0" x2="1512" y2="1080"/>
      <line x1="1566" y1="0" x2="1566" y2="1080"/>
      <line x1="1674" y1="0" x2="1674" y2="1080"/>
      <line x1="1728" y1="0" x2="1728" y2="1080"/>
      <line x1="1782" y1="0" x2="1782" y2="1080"/>
      <line x1="1836" y1="0" x2="1836" y2="1080"/>
      <line x1="0" y1="54" x2="1920" y2="54"/>
      <line x1="0" y1="108" x2="1920" y2="108"/>
      <line x1="0" y1="162" x2="1920" y2="162"/>
      <line x1="0" y1="216" x2="1920" y2="216"/>
      <line x1="0" y1="324" x2="1920" y2="324"/>
      <line x1="0" y1="378" x2="1920" y2="378"/>
      <line x1="0" y1="432" x2="1920" y2="432"/>
      <line x1="0" y1="486" x2="1920" y2="486"/>
      <line x1="0" y1="594" x2="1920" y2="594"/>
      <line x1="0" y1="648" x2="1920" y2="648"/>
      <line x1="0" y1="702" x2="1920" y2="702"/>
      <line x1="0" y1="756" x2="1920" y2="756"/>
      <line x1="0" y1="864" x2="1920" y2="864"/>
      <line x1="0" y1="918" x2="1920" y2="918"/>
      <line x1="0" y1="972" x2="1920" y2="972"/>
      <line x1="0" y1="1026" x2="1920" y2="1026"/>
    </g>
    <g stroke-opacity="0.15" stroke-width="1.5">
      <line x1="0" y1="0" x2="0" y2="1080"/>
      <line x1="270" y1="0" x2="270" y2="1080"/>
      <line x1="540" y1="0" x2="540" y2="1080"/>
      <line x1="810" y1="0" x2="810" y2="1080"/>
      <line x1="1080" y1="0" x2="1080" y2="1080"/>
      <line x1="1350" y1="0" x2="1350" y2="1080"/>
      <line x1="1620" y1="0" x2="1620" y2="1080"/>
      <line x1="1890" y1="0" x2="1890" y2="1080"/>
      <line x1="0" y1="0" x2="1920" y2="0"/>
      <line x1="0" y1="270" x2="1920" y2="270"/>
      <line x1="0" y1="540" x2="1920" y2="540"/>
      <line x1="0" y1="810" x2="1920" y2="810"/>
      <line x1="0" y1="1080" x2="1920" y2="1080"/>
    </g>
  </g>

    <rect width="1920" height="1080" fill="url(#rightFade)"/>
    <rect width="1920" height="1080" fill="url(#vignette)"/>
    <rect width="1920" height="1080" filter="url(#grain)" style="mix-blend-mode:overlay" opacity="0.9"/>

    <g id="scan">
      <rect x="-150" y="0" width="150" height="1080" fill="url(#scanGrad)"/>
      <rect x="-2"   y="0" width="2"   height="1080" fill="#ffffff" opacity="0.45"/>
    </g>

    <g id="sweep">
      <rect x="-500" y="120" width="500" height="840" fill="#9fc4ff" opacity="0.05" filter="url(#sweepBlur)"/>
    </g>
  </g>

  <g id="title">
    <rect id="rule" x="156" y="455" width="260" height="3" fill="url(#ruleGrad)"/>
    <rect id="dot"  x="147" y="452" width="9" height="9" rx="1.5" fill="#8fe3ff"/>

    <g id="name">
    <text class="ch cjk" x="156.0" y="595" style="--d:0.950s">赛</text>
    <text class="ch cjk" x="275.0" y="595" style="--d:1.035s">博</text>
    <text class="ch cjk" x="394.0" y="595" style="--d:1.120s">搬</text>
    <text class="ch cjk" x="513.0" y="595" style="--d:1.205s">砖</text>
    <text class="ch cjk" x="632.0" y="595" style="--d:1.290s">皮</text>
    <text class="ch cjk" x="751.0" y="595" style="--d:1.375s">卡</text>
    <text class="ch cjk" x="870.0" y="595" style="--d:1.460s">付</text>
    </g>

    <text id="slogan" class="cjk" x="156" y="679" font-size="42" font-weight="400" fill="#98a0b6">聊一聊赛博世界的<tspan class="mono" font-size="40" fill="#8fe3ff">everything</tspan></text>
  </g>
</svg>
